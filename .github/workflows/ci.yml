name: Pachisi checks
# Hosted Actions cannot run while the organisation's GitHub billing is locked, so the
# workflow is manual-only. The release gate is the local mirror of this job:
#   pnpm ci:local
# It runs the same steps and records evidence in docs/validation/local-ci.json.
# Restore `on: [push, pull_request]` once hosted runners are available again.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.13.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test:consumer
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
