<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene test</title>
<link rel="stylesheet" href="../src/tokens.css"><link rel="stylesheet" href="../src/scene.css">
<style>body{margin:0}#phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg)}#host{position:absolute;inset:0}
#q{position:absolute;left:40px;right:40px;top:220px;height:200px;pointer-events:none}</style></head>
<body><div id="phone" data-theme="light"><div id="host"></div><div id="q"></div></div>
<script src="../src/scene.js"></script>
<script>
var t = new URLSearchParams(location.search).get('theme'); if (t) document.getElementById('phone').dataset.theme = t;
var host = document.getElementById('host'), q = document.getElementById('q');
window.ctl = ESScene.mount(host, { depth: 0, quiet: function () { var h = host.getBoundingClientRect(), r = q.getBoundingClientRect();
  return [new DOMRect(r.left - h.left, r.top - h.top, r.width, r.height)]; } });
</script></body></html>
